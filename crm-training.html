<link rel="manifest" href="manifest.json">

<body>

<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <button class="mobile-close-btn" onclick="closeMobileSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="mark" id="sidebarMark"></div>
    <div class="name">Favze CRM</div>
  </div>
  <nav class="side-nav" id="sideNav"></nav>
  <div class="side-foot" id="sideFoot" onclick="openProfileModal()" style="cursor:pointer;">
    <div class="avatar" id="profileAvatar">RC</div>
    <div><div class="who" id="profileName">Riley Catalano</div><div class="role" id="profileRole">Founder, Favze</div></div>
  </div>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>

<main>
  <div class="topbar">
    <button class="icon-btn mobile-menu-btn" onclick="openMobileSidebar()" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="search" style="position:relative;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Search everything" oninput="onSearch(this.value)" onfocus="onSearch(this.value)" onblur="setTimeout(hideGlobalSearch,150)">
      <div class="global-search-results" id="globalSearchResults"></div>
    </div>
    <div class="top-actions">
      <div style="position:relative;">
        <button class="icon-btn" onclick="toggleNotifDropdown()" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="global-search-results" id="notifDropdown" style="left:auto; right:0; width:340px;"></div>
      </div>
      <button class="icon-btn" onclick="switchView('settings')" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn-new" onclick="openNewModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg>
        <span id="btnNewLabel">New Contact</span>
      </button>
    </div>
  </div>
  <div class="content" id="content">
    <p style="color:var(--slate); font-size:13px;">Loading your CRM...</p>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalPanel">
    <div class="modal-head">
      <h3 id="modalTitle">New Contact</h3>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="mark" style="margin:0 auto 16px; width:48px; height:48px;"><img id="lockLogoImg" src="" alt="logo"></div>
    <h2 style="font-size:26px; color:#fff; font-family:'Barlow Condensed'; font-weight:900; margin-bottom:6px;">Session locked</h2>
    <p style="font-size:13px; color:#9db3cc; margin-bottom:22px;">Locked after inactivity to protect client data. Signed in as <span id="lockProfileName">Riley Catalano</span>.</p>
    <button class="btn-primary" onclick="unlockSession()">Continue working</button>
  </div>
</div>
<input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVImport(this)">
<input type="file" id="logoUploadInput" accept="image/*" style="display:none;" onchange="handleLogoUpload(this)">
<input type="file" id="icsFileInput" accept=".ics" style="display:none;" onchange="handleICSImport(this)">
<input type="file" id="htmlEmailInput" accept=".html,.htm" style="display:none;" onchange="handleHTMLImport(this)">
<input type="file" id="profileAvatarInput" accept="image/*" style="display:none;" onchange="handleProfileAvatarUpload(this)">
<input type="file" id="userAvatarInput" accept="image/*" style="display:none;" onchange="handleUserAvatarUpload(this)">
<input type="file" id="candidateUploadInput" accept=".pdf" multiple style="display:none;" onchange="handleCandidateUpload(this)">

<script>window.FAVZE_VIEW = 'training';</script>
<script src="app.js"></script>
</body>
</html>
